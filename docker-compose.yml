x-backend: &backend
  build:
    context: ./backend
    dockerfile: ../docker/backend.Dockerfile
  image: instabrain-backend
  env_file: .env
  environment:
    INSTABRAIN_DATABASE_URL: postgresql+psycopg://instabrain:instabrain@postgres:5432/instabrain
    INSTABRAIN_REDIS_URL: redis://redis:6379/0
    INSTABRAIN_DATA_DIR: /data
    INSTABRAIN_TASK_BACKEND: celery
  volumes:
    - importdata:/data
    - models:/models
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: instabrain
      POSTGRES_PASSWORD: instabrain
      POSTGRES_DB: instabrain
    ports:
      - "${INSTABRAIN_PG_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U instabrain"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # Append-only file: queued tasks survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${INSTABRAIN_REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO",
              "--concurrency=2", "-Q", "instabrain.imports"]
    # SIGTERM → warm shutdown: the current file finishes. If the grace period expires the task
    # is redelivered/swept and resumes from the last committed file.
    stop_grace_period: 60s
    restart: unless-stopped

  media-worker:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    # OCR + Whisper are CPU-heavy; keep them off the import queue. One process per CPU-bound job.
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO",
              "--concurrency=1", "-Q", "instabrain.media", "-n", "media@%h"]
    stop_grace_period: 120s
    restart: unless-stopped

  beat:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    restart: unless-stopped

volumes:
  models:
  pgdata:
  redisdata:
  importdata:
